name: Android Build

# F-Droid builds Materializr from source for arm64-v8a, using the same
# android/scripts/setup-deps.sh + Gradle path this job runs. Until this
# workflow existed, Android was the ONLY shipping platform nothing in CI
# compiled — which is exactly how a greedy hex escape (`\x93` swallowing the
# next digit: a warning under desktop GCC, a hard ERROR under the NDK's clang)
# reached main and broke the F-Droid build. Anything that compiles on Linux,
# Windows and macOS but not under the NDK now fails here instead of at release
# time.
#
# Deliberately assembleDebug: it compiles every native source the release build
# does — where the NDK-only errors live — while needing no signing secrets.

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'packaging/**'
      - '.github/workflows/linux.yml'
      - '.github/workflows/windows.yml'
      - '.github/workflows/macos.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK (arm64-v8a)
    runs-on: ubuntu-22.04
    env:
      ABI: arm64-v8a
      # Must match android/app/build.gradle's ndkVersion.
      NDK_VERSION: '28.2.13676358'
      # setup-deps.sh's download/build tree — inside the workspace so the cache
      # paths below are relative and predictable.
      MATERIALIZR_WORK: ${{ github.workspace }}/.android-work
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The OCCT cross-build is disk-hungry; the hosted image ships several GB
      # of toolchains this job never touches.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk \
                      /usr/share/dotnet /usr/local/share/powershell \
                      /usr/share/swift /opt/ghc || true
          df -h /

      - name: Install pinned NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # SDL2 + FreeType + OCCT 7.9.3 cross-compile is ~30-40 min and only
      # changes when setup-deps.sh (which pins every version) or the NDK does.
      - name: Cache native prerequisites
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            .android-work/prefix/arm64-v8a
            android/app/src/main/jniLibs/arm64-v8a
            android/app/jni/SDL
          key: android-deps-arm64-v8a-ndk${{ env.NDK_VERSION }}-${{ hashFiles('android/scripts/setup-deps.sh') }}

      - name: Build native prerequisites (SDL2 + FreeType + OCCT)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ABI="$ABI" JOBS="$(nproc)" ./android/scripts/setup-deps.sh

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug -PtargetAbi=${{ env.ABI }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: materializr-android-arm64-v8a-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
