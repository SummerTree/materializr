name: Checks

# The two repo hygiene gates, which until now existed as scripts nobody ran.
# Both are pure Python with no dependencies, so this job is seconds, not
# minutes - it is deliberately separate from the three build workflows so a
# style failure reports in under a minute instead of behind a Windows build.
#
# NOTE the missing paths-ignore. The build workflows skip '**.md' and 'docs/**'
# because documentation cannot break a compile. It can break these: docs and
# markdown are exactly where em-dashes accumulate, and docs/units-audit.md is
# the file the second gate compares against. Skipping those paths here would
# make the gate blind to most of what it is for.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Repo gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Project rule: no em-dashes, use a hyphen. The gate matches BOTH
      # spellings - the literal character and the six-character escape a C++
      # string uses for the same three bytes. That second form is why four
      # hand sweeps in a row missed 54 user-facing strings: no search for the
      # literal character can see a single one of them.
      - name: No em-dashes
        run: python3 tools/no_em_dashes.py

      # An OCCT boolean performed twice for one result. The two-shape
      # constructor of BRepAlgoAPI_Cut/Fuse/Common already builds, so a
      # trailing Build() runs the whole boolean a second time and throws the
      # first result away. It reads as correct code, which is how thirty-one
      # sites drifted into it unreviewed.
      - name: No double-built booleans
        run: |
          python3 tools/no_double_build.py --selftest
          python3 tools/no_double_build.py

      # The display-units inventory. Unclassified rows mean real unconverted
      # work exists: that FAILS. A committed docs/ copy that differs from a
      # fresh run only means the inventory wasn't regenerated - a WARNING, not
      # a red build. Failing on that drift (when the docs still carried line
      # numbers, any edit that shifted lines tripped it) made most Checks runs
      # red for nothing, which teaches everyone to ignore the gate.
      - name: Units audit has no open rows
        run: |
          python3 tools/units_audit.py
          if ! git diff --quiet docs/units-audit.md docs/units-audit-allow.txt; then
            echo "::warning title=Units audit docs are stale::Run python3 tools/units_audit.py and commit docs/units-audit*.  (Not a failure.)"
          fi
